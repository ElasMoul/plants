# ──────────────────────────────────────────────────────────────────────────────
# PlantPal – Development Profile
# Start local infrastructure first: docker-compose up -d
# Copy backend/.env.example → backend/.env and fill in values.
# ──────────────────────────────────────────────────────────────────────────────

spring:

  # ── Database ────────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/plantpal_dev
    username: ${DB_USERNAME:plantpal}   # Default 'plantpal' matches docker-compose.yml
    password: ${DB_PASSWORD:plantpal}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000         # ms — fail fast rather than hang
      idle-timeout: 600000

  # ── Redis ────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      # Liquibase owns the schema — never let Hibernate touch it
      ddl-auto: validate
    show-sql: false                     # Use query logging via p6spy if needed
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  # ── Liquibase ────────────────────────────────────────────────────────────────
  liquibase:
    enabled: true
    contexts: dev
    change-log: classpath:db/changelog/db.changelog-master.xml

  # ── Kafka — async identification pipeline ──────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: plantpal-identification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.plantpal.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ──── GitHub Models (vision: identification + annotation; text: o4-mini / gpt-4.1-mini) ───────
github:
  base-url: ${GITHUB_BASE_URL:https://models.inference.ai.azure.com}
  token: ${GITHUB_TOKEN}
  models:
    identification-model: ${GITHUB_IDENTIFICATION_MODEL:gpt-4o}
    annotation-model: ${GITHUB_ANNOTATION_MODEL:gpt-4o-mini}
    gpt41-model: ${GITHUB_GPT41_MODEL:gpt-4.1}             # VisionModelPreference.GITHUB_GPT41
    o4-mini-model: ${GITHUB_O4_MINI_MODEL:o4-mini}          # ReasoningModelPreference.GITHUB_O4_MINI
    gpt41-mini-model: ${GITHUB_GPT41_MINI_MODEL:gpt-4.1-mini} # ReasoningModelPreference.GITHUB_GPT41_MINI

# ──── DeepSeek (text-only: care plan + cure advice via GitHub Models endpoint) ─
deepseek:
  model: ${DEEPSEEK_MODEL:DeepSeek-R1}

# ──── Ollama (local AI) ───────────────────────────────────────────────────────
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:gemma3:4b}      # Local: gemma3:4b; dedicated LAN machine: gemma3:12b-it-qat
  # Long timeout: 12B model on GTX 1660 takes 60–120s vision / 30–60s text due to CPU offload
  read-timeout-minutes: ${OLLAMA_READ_TIMEOUT_MINUTES:5}
  connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:10}
  keep-alive: ${OLLAMA_KEEP_ALIVE:10m}  # Keeps the model loaded between calls; set OLLAMA_KEEP_ALIVE=10m on the host too

# ──── Anthropic (Claude — vision + reasoning) ─────────────────────────────────
# api.key has no required default: an un-keyed Claude is reported as unavailable on the
# preferences endpoint instead of failing application startup (see AnthropicClient).
anthropic:
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  api:
    key: ${ANTHROPIC_API_KEY:}
  models:
    default: ${ANTHROPIC_MODEL_DEFAULT:claude-sonnet-4-6}
    cheap: ${ANTHROPIC_MODEL_CHEAP:claude-haiku-4-5-20251001}
    max: ${ANTHROPIC_MODEL_MAX:claude-opus-4-8}

# ──── Application-specific settings ──────────────────────────────────────────
app:

  cors:
    allowed-origins: "*"               # Dev only — open for phone testing via PC IP

  jwt:
    # Minimum 64 characters for HS256. Generate: openssl rand -base64 64
    secret: ${JWT_SECRET}
    expiration-ms: 86400000             # 24 hours

  storage:
    type: local                         # 'local' | 's3' | 'cloudinary'
    local-path: /tmp/plantpal/photos

  web-push:
    public-key: ${VAPID_PUBLIC_KEY}     # Generate: npx web-push generate-vapid-keys
    private-key: ${VAPID_PRIVATE_KEY}
    subject: mailto:contact@plantpal.app

  rate-limit:
    ai-calls-per-hour: 20              # Per authenticated user
    auth-attempts-per-minute: 5        # Brute-force protection on /api/auth/**
    github-models-tokens-per-minute: 40000  # Global token-budget bucket for outbound GitHub Models calls

  plantnet:
    api-key: ${PLANTNET_API_KEY}
    base-url: ${PLANTNET_BASE_URL:https://my-api.plantnet.org}
    project: ${PLANTNET_PROJECT:all}
    nb-results: ${PLANTNET_NB_RESULTS:6}
    lang: ${PLANTNET_LANG:en}
    always-on-candidates: ${PLANTNET_ALWAYS_ON:true}
    auto-confirm-score: ${PLANTNET_AUTO_CONFIRM_SCORE:0.90}  # Top candidate score threshold for one-tap auto-confirm

# ──── Logging (dev: verbose) ──────────────────────────────────────────────────
logging:
  level:
    com.plantpal: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
