# ──────────────────────────────────────────────────────────────────────────────
# PlantPal – Base Application Configuration
# Profile-specific files (application-dev.yml, application-prod.yml, etc.)
# override values defined here. Never put secrets in this file.
# ──────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: plantpal

  # Active profile is set via SPRING_PROFILES_ACTIVE env var or -Dspring.profiles.active
  profiles:
    active: dev

  # Disable open-in-view to avoid lazy-loading surprises across HTTP boundaries
  jpa:
    open-in-view: false

  # Photo uploads — phone cameras produce 3-10MB images
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  # Outgoing mail (PLA-25). Credentials are env-var only; staging/prod override host/user/password
  # with no default. Dev defaults to app.mail.transport=log, so no SMTP server is needed locally.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # Bounded so a stalled provider cannot hang the dispatcher; the retry policy takes over.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Jackson: ISO-8601 dates, omit null fields globally
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ──── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080

# ──── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ──── Logging ─────────────────────────────────────────────────────────────────
# Actual console format is owned by logback-spring.xml (T-DEPLOY.1): human-readable
# pattern with correlationId/userId from MDC everywhere except staging/prod, which get
# structured JSON instead. logging.level.* below still applies normally — Spring Boot sets
# logger levels programmatically after the logging system initializes, independent of the
# custom logback file.
logging:
  level:
    root: INFO

# ──── CORS ────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins. Override with CORS_ALLOWED_ORIGINS env var.
# Production example: CORS_ALLOWED_ORIGINS=https://plantpal.app
app:
  # Public origin used to build links in emails (app home and the reminder unsubscribe link).
  # /api/* is proxied to the backend on that origin, so one value serves both.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  # ── Transactional email (PLA-25) ─────────────────────────────────────────────
  # transport 'log' (default): nothing leaves the process, only a masked line is logged.
  # transport 'smtp': real delivery through spring.mail.* (Resend). A failed send is retried
  # with exponential backoff (retry-base-delay x 1,2,4,8...) up to max-attempts, then the
  # outbox row becomes FAILED, an ERROR is logged and /api/v1/admin/email-deliveries?status=FAILED
  # lists it. See MailService / EmailDispatcher.
  mail:
    transport: ${MAIL_TRANSPORT:log}
    from: ${MAIL_FROM:Planotell <no-reply@localhost>}
    max-attempts: 5
    retry-base-delay: PT1M
    claim-lease: PT2M
    batch-size: 10
    poll-interval: PT10S

  # ── Self-service data export (PLA-112) ────────────────────────────────────────
  # ZIPs are written to `directory` as {userId}-{uuid}.zip and deleted by an hourly job once
  # older than `retention-hours` (documented in docs/data-export.md and shown in the UI).
  export:
    directory: ${APP_EXPORT_DIRECTORY:${java.io.tmpdir}/plantpal-exports}
    retention-hours: ${APP_EXPORT_RETENTION_HOURS:24}
    rate-limit-per-hour: ${APP_EXPORT_RATE_LIMIT_PER_HOUR:3}
    max-photos: ${APP_EXPORT_MAX_PHOTOS:200}
    max-photo-bytes: ${APP_EXPORT_MAX_PHOTO_BYTES:209715200}

  # ── Identification transport (T-DEPLOY.5) ────────────────────────────────────
  # 'kafka' (default): identification runs through the async Kafka pipeline (identification
  # .requested topic + IdentificationConsumer) — unchanged dev/local/test behavior.
  # 'in-process': no Kafka broker required. IdentificationServiceImpl.processIdentification(...)
  # runs directly on aiTaskExecutor instead — see IdentificationDispatcher. v1.0.0 ships prod/
  # staging on 'in-process' (see application-prod.yml / application-staging.yml); async-at-scale
  # via Kafka is revisited later. This same toggle also gates every other Kafka producer in the
  # app (plant_count dimension events, the identification.completed notification) — see
  # KafkaTransportProperties.
  identification:
    transport: ${APP_IDENTIFICATION_TRANSPORT:kafka}

  # ── Session registry (mission 9b774285, wave 3) ──────────────────────────────
  # Redis-backed, server-authoritative session record keyed by the JWT's jti (ADR-1).
  # Ships INERT: idleTtlSeconds/absoluteCapHours govern the registry's own sliding/
  # absolute bookkeeping from the moment the app boots, but enforcementEnabled=false
  # means JwtAuthFilter never rejects a request over it — a session with no live
  # registry record still authenticates on signature+exp alone, exactly as before this
  # wave. Flipping enforcement-enabled is wave 5's own deliberate, separately-
  # authorized release event (ADR-8) — do not set this true outside that cutover.
  session:
    idle-ttl-seconds: ${APP_SESSION_IDLE_TTL_SECONDS:1800}
    absolute-cap-hours: ${APP_SESSION_ABSOLUTE_CAP_HOURS:12}
    enforcement-enabled: ${APP_SESSION_ENFORCEMENT_ENABLED:false}

# ──── Sentry ──────────────────────────────────────────────────────────────────
# Empty DSN disables Sentry. Set SENTRY_DSN in production environment.
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  environment: ${SPRING_PROFILES_ACTIVE:dev}

# ──── SpringDoc / Swagger ─────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

# ──── Platform ai-gateway (D022 gateway swap) ────────────────────────────────
# No platform.* config here by design: the base/default profile must boot and serve
# fully standalone, with zero platform.* keys required or read (D009). The gateway
# path only exists under the `platform` profile — see application-platform.yml.
# Never active in prod — Railway's prod env never sets that profile. See DEPLOYMENT.md.
