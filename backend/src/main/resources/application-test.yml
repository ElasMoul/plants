# ──────────────────────────────────────────────────────────────────────────────
# PlantPal – Test Profile
# Used by Testcontainers integration tests (@SpringBootTest).
# PostgreSQL and Redis containers are started automatically via @ServiceConnection.
# No real infrastructure needed — Testcontainers spins up Docker containers.
# ──────────────────────────────────────────────────────────────────────────────

spring:
  # ── Liquibase ────────────────────────────────────────────────────────────────
  liquibase:
    enabled: true
    contexts: test
    change-log: classpath:db/changelog/db.changelog-master.xml

  # ── Kafka ────────────────────────────────────────────────────────────────────
  # IT tests exercise HTTP endpoints only — the async Kafka pipeline is out of scope.
  # Disabling auto-startup prevents the consumer from retrying localhost:9092 (absent in CI).
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

  # ── JPA ──────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate               # Liquibase always owns the schema
    show-sql: false

# ──── Anthropic API (placeholder — AI calls are mocked in tests) ──────────────
anthropic:
  api:
    key: test-api-key-placeholder

# ──── AI clients (placeholders — these have no application.yml-level default and would
# otherwise fail ApplicationContext startup with "Could not resolve placeholder" the moment any
# integration test boots the full context. The actual AI clients themselves are @MockBean'd in
# any IT that exercises a controller backed by one, so these values are never used for a real
# call. This is also why integration tests have never reliably loaded the context before — see
# BACKEND.md's "Integration tests not running in CI" note.) ───────────────────
github:
  token: test-github-token-placeholder

# ──── Application settings ────────────────────────────────────────────────────
app:

  plantnet:
    api-key: test-plantnet-api-key-placeholder

  jwt:
    # Obviously-fake test-only constant (SEC-4). Must stay valid standard Base64
    # (JwtUtil does Decoders.BASE64.decode) and decode to >= 32 bytes for JJWT's
    # HS256 key-length check — 64 base64 chars decode to 48 bytes. Never use in
    # production.
    secret: TESTONLYFAKEKEY0TESTONLYFAKEKEY0TESTONLYFAKEKEY0TESTONLYFAKEKEY0
    expiration-ms: 3600000             # 1 hour — short for tests

  storage:
    type: local
    local-path: /tmp/plantpal-test/photos

  web-push:
    # nl.martijndwars:web-push validates these as real P-256 EC points at WebPushServiceImpl
    # construction time (PushService's constructor decodes them) -- a non-EC placeholder string
    # fails ApplicationContext startup with "Invalid point encoding" the moment any integration
    # test boots the full context. This is a real (freshly generated, never used anywhere else)
    # test-only key pair, not a production secret.
    public-key: BLhowkMbZpHjPN2xWYz6BRLQKNSJ35tZGtSUW7YtXmuvPZ8Q3D1QGi1z9ajYVk5K9dQwrFAlZS2yny8XSB3XmNo
    private-key: adZn9Dosb0SoRcxR0G8VUzanNA9sLzFiGvH4jDVFqWA
    subject: mailto:test@plantpal.app

  rate-limit:
    # Effectively unlimited in tests to avoid rate-limiter interference
    ai-calls-per-hour: 10000
    auth-attempts-per-minute: 10000
    register-per-hour: 10000
    chat-messages-per-hour: 10000

# ──── Logging (test: quieter, highlight app logs) ─────────────────────────────
logging:
  level:
    com.plantpal: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.springframework.security: WARN
