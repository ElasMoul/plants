# ──────────────────────────────────────────────────────────────────────────────
# PlantPal – Staging Profile (T-DEPLOY.1)
# Deployed to Railway. Activate with SPRING_PROFILES_ACTIVE=staging.
# All values below are env-var driven with NO insecure defaults — see
# backend/.env.example's "Staging / Production" section for the full list.
# ──────────────────────────────────────────────────────────────────────────────

spring:

  # ── Database ────────────────────────────────────────────────────────────────
  # DATABASE_URL must be a single JDBC URL with credentials embedded as query params
  # (jdbc:postgresql://host:port/db?user=...&password=...), not the postgres:// URI
  # some platforms hand out — translate at the platform/env level if needed. No
  # default: an unset DATABASE_URL fails datasource startup fast rather than
  # silently falling back to a local dev database.
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000        # ms — fail fast rather than hang

  # ── Redis ────────────────────────────────────────────────────────────────────
  # REDIS_URL must be a redis:// (or rediss:// for TLS) URI — spring.data.redis.url
  # parses scheme/host/port/password from it, taking priority over host/port below.
  data:
    redis:
      url: ${REDIS_URL}

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate               # Liquibase owns the schema — never let Hibernate touch it
    show-sql: false

  # ── Liquibase ────────────────────────────────────────────────────────────────
  liquibase:
    enabled: true
    contexts: staging
    change-log: classpath:db/changelog/db.changelog-master.xml

  # ── Kafka — async identification pipeline ──────────────────────────────────
  # No fallback default: prod/staging Kafka topology is still an open decision
  # (T-DEPLOY.5) — an unset value should fail fast, not silently point at localhost.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: plantpal-identification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.plantpal.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ──── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}                   # Railway injects PORT

# ──── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ──── Logging (JSON via logback-spring.xml's staging,prod springProfile block) ─
logging:
  level:
    com.plantpal: INFO
    org.springframework: WARN

# ──── GitHub Models / DeepSeek / Ollama / Anthropic / PlantNet ────────────────
# No overrides here — base application.yml + these env vars already cover every
# AI provider; staging uses the same real credentials as prod unless the platform
# team provisions separate ones.
github:
  token: ${GITHUB_TOKEN}

# ──── Application-specific settings ──────────────────────────────────────────
app:

  cors:
    # No insecure localhost fallback in staging/prod — must be set explicitly.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000            # 24 hours

  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:/tmp/plantpal/photos}

  web-push:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: mailto:contact@plantpal.app

  rate-limit:
    ai-calls-per-hour: 20
    auth-attempts-per-minute: 5
    register-per-hour: 3
    chat-messages-per-hour: 10

  plantnet:
    api-key: ${PLANTNET_API_KEY}
