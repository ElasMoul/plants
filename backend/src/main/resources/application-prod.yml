# ──────────────────────────────────────────────────────────────────────────────
# PlantPal – Production Profile (T-DEPLOY.1)
# Deployed to Railway (railway up). Activate with SPRING_PROFILES_ACTIVE=prod.
# All values below are env-var driven with NO insecure defaults — see
# backend/.env.example's "Staging / Production" section for the full list.
# The `platform` profile (application-platform.yml) is never activated here —
# see DEPLOYMENT.md.
# ──────────────────────────────────────────────────────────────────────────────

spring:

  # ── Database ────────────────────────────────────────────────────────────────
  # DATABASE_URL must be a single JDBC URL with credentials embedded as query params
  # (jdbc:postgresql://host:port/db?user=...&password=...), not the postgres:// URI
  # some platforms hand out — translate at the platform/env level if needed. No
  # default: an unset DATABASE_URL fails datasource startup fast rather than
  # silently falling back to a local dev database.
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000        # ms — fail fast rather than hang

  # ── Redis ────────────────────────────────────────────────────────────────────
  # REDIS_URL must be a redis:// (or rediss:// for TLS) URI — spring.data.redis.url
  # parses scheme/host/port/password from it, taking priority over host/port below.
  data:
    redis:
      url: ${REDIS_URL}

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate               # Liquibase owns the schema — never let Hibernate touch it
    show-sql: false

  # ── Liquibase ────────────────────────────────────────────────────────────────
  liquibase:
    enabled: true
    contexts: prod
    change-log: classpath:db/changelog/db.changelog-master.xml

  # ── Kafka — inert in prod (T-DEPLOY.5: v1.0.0 ships without a Kafka broker in production) ──
  # app.identification.transport=in-process below means none of our own Kafka producer/consumer/
  # topic beans are created, so this section is never actually dialed — but Spring Boot's
  # KafkaProperties still binds spring.kafka.bootstrap-servers eagerly at startup regardless of
  # bean conditions, so an unset KAFKA_BOOTSTRAP_SERVERS must not fail placeholder resolution.
  # Safe to fall back to localhost:9092 here precisely because nothing ever connects to it.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: plantpal-identification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.plantpal.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ──── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}                   # Railway injects PORT

# ──── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ──── Logging (JSON via logback-spring.xml's staging,prod springProfile block) ─
logging:
  level:
    com.plantpal: INFO
    org.springframework: WARN

# ──── GitHub Models — real prod credentials ───────────────────────────────────
github:
  token: ${GITHUB_TOKEN}

# ──── Application-specific settings ──────────────────────────────────────────
app:

  cors:
    # No insecure localhost fallback in staging/prod — must be set explicitly.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  # ── Identification transport (T-DEPLOY.5) ────────────────────────────────────
  # v1.0.0 ships without a Kafka broker in production: identification runs in-process on
  # aiTaskExecutor instead of via the identification.requested Kafka topic. See
  # application.yml's app.identification.transport comment and KafkaTransportProperties.
  identification:
    transport: in-process

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000            # 24 hours

  # STORAGE_TYPE=cloudinary + CLOUDINARY_URL (cloudinary://api_key:api_secret@cloud_name)
  # is the durable production setup — 'local' writes to the container disk, which Railway
  # wipes on every redeploy (only the 30-day Redis byte-cache survives).
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:/tmp/plantpal/photos}
    cloudinary-url: ${CLOUDINARY_URL:}

  web-push:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: mailto:contact@plantpal.app

  rate-limit:
    ai-calls-per-hour: 20
    auth-attempts-per-minute: 5
    register-per-hour: 3
    chat-messages-per-hour: 10

  plantnet:
    api-key: ${PLANTNET_API_KEY}
