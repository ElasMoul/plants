<mat-toolbar color="primary" class="navbar">
  <a class="brand" routerLink="/">
    <mat-icon>local_florist</mat-icon>
    <span>PlantPal</span>
  </a>

  <!-- Desktop navigation — hidden on mobile (bottom nav takes over) -->
  <nav class="nav-links" *ngIf="authService.isLoggedIn()">
    <a
      *ngFor="let link of navLinks"
      mat-button
      [routerLink]="link.route"
      routerLinkActive="active-link"
    >
      <mat-icon>{{ link.icon }}</mat-icon>
      <span class="nav-label">{{ link.label }}</span>
    </a>
  </nav>

  <span class="spacer"></span>

  <!-- AI Test — desktop only dev tool -->
  <a mat-button routerLink="/ai-test" routerLinkActive="active-link" class="ai-test-link">
    <mat-icon>science</mat-icon>
    <span class="nav-label">AI Test</span>
  </a>

  <app-model-selector
    *ngIf="authService.isLoggedIn()"
    class="model-selector-toolbar"
  ></app-model-selector>

  <ng-container *ngIf="authService.isLoggedIn(); else loginBtn">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div mat-menu-item disabled>{{ authService.getCurrentUser()?.email }}</div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  </ng-container>

  <ng-template #loginBtn>
    <a mat-button routerLink="/login">
      <mat-icon>login</mat-icon>
      <span class="nav-label">Login</span>
    </a>
  </ng-template>
</mat-toolbar>

<main class="app-content with-toolbar" [class.with-bottom-nav]="authService.isLoggedIn()">
  <router-outlet></router-outlet>
</main>

<!-- Bottom navigation — mobile only, shown when logged in -->
<nav class="bottom-nav" *ngIf="authService.isLoggedIn()">
  <a
    *ngFor="let link of navLinks"
    class="bottom-nav-item"
    [routerLink]="link.route"
    routerLinkActive="active"
  >
    <mat-icon>{{ link.icon }}</mat-icon>
    <span>{{ link.label }}</span>
  </a>
</nav>
