<mat-toolbar class="navbar">
  <a class="brand" routerLink="/">
    <mat-icon class="brand-icon">local_florist</mat-icon>
    <span class="brand-name">PlantPal</span>
  </a>

  <span class="spacer"></span>

  <app-model-selector
    *ngIf="authService.isLoggedIn()"
    class="model-selector-toolbar"
  ></app-model-selector>

  <ng-container *ngIf="authService.isLoggedIn(); else loginBtn">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div mat-menu-item disabled>{{ authService.getCurrentUser()?.email }}</div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  </ng-container>

  <ng-template #loginBtn>
    <a mat-button routerLink="/login" class="login-btn">Sign in</a>
  </ng-template>
</mat-toolbar>

<main class="app-content with-toolbar" [class.with-bottom-nav]="authService.isLoggedIn()">
  <router-outlet></router-outlet>
</main>

<!-- Bottom navigation — mobile only -->
<nav class="bottom-nav" *ngIf="authService.isLoggedIn()">
  <a
    *ngFor="let link of navLinks"
    class="bottom-nav-item"
    [routerLink]="link.route"
    routerLinkActive="active"
    #rla="routerLinkActive"
  >
    <span class="nav-pill" [class.nav-pill--active]="rla.isActive">
      <mat-icon>{{ link.icon }}</mat-icon>
      <span class="nav-label">{{ link.label }}</span>
    </span>
  </a>
</nav>
