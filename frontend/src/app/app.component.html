<mat-toolbar class="navbar" *ngIf="!isAdminPage">
  <a class="brand" routerLink="/">
    <mat-icon class="brand-icon">local_florist</mat-icon>
    <span class="brand-name">{{ 'PlantPal' | t }}</span>
  </a>

  <!-- Desktop nav — the bottom nav is mobile-only, so these are the ONLY way to
       reach other pages above 768px -->
  <nav class="top-nav" *ngIf="authService.isLoggedIn()">
    <a
      *ngFor="let link of navLinks"
      class="top-nav-item"
      [routerLink]="link.route"
      routerLinkActive="top-nav-item--active"
    >
      {{ link.label | t }}
    </a>
  </nav>

  <span class="spacer"></span>
  <app-language-switch></app-language-switch>

  <ng-container *ngIf="authService.isLoggedIn(); else loginBtn">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn" [attr.aria-label]="&#x27;User menu&#x27; | t">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div mat-menu-item disabled>{{ authService.getCurrentUser()?.email }}</div>
      <mat-divider></mat-divider>
      <button mat-menu-item routerLink="/admin" *ngIf="isAdministrator">
        <mat-icon>admin_panel_settings</mat-icon><span>{{ 'Administration' | t }}</span>
      </button>
      <button mat-menu-item routerLink="/preferences">
        <mat-icon>tune</mat-icon>
        <span>{{ 'AI Model Settings' | t }}</span>
      </button>
      <button mat-menu-item routerLink="/voice-test">
        <mat-icon>mic</mat-icon>
        <span>{{ 'Voice Test' | t }}</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ 'Sign out' | t }}</span>
      </button>
    </mat-menu>
  </ng-container>

  <ng-template #loginBtn>
    <a mat-button routerLink="/login" class="login-btn">{{ 'Sign in' | t }}</a>
  </ng-template>
</mat-toolbar>

<main [class.app-content]="!isAdminPage" [class.with-toolbar]="!isAdminPage" [class.with-bottom-nav]="authService.isLoggedIn() && !isAdminPage">

  <!-- Friendly in-app prompt before the native browser permission dialog -->
  <div class="notification-banner" *ngIf="showNotificationBanner && !isAdminPage">
    <mat-icon class="banner-icon">notifications_active</mat-icon>
    <div class="banner-text">
      <p class="banner-title">{{ 'Get reminders on your phone' | t }}</p>
      <p class="banner-sub">{{ 'We\'ll notify you when it\'s time to water or care for your plants.' | t }}</p>
    </div>
    <div class="banner-actions">
      <button mat-button type="button" (click)="dismissNotifications()">{{ 'Not now' | t }}</button>
      <button mat-raised-button color="primary" type="button" class="btn-pill" (click)="acceptNotifications()">
        {{ 'Enable' | t }}
      </button>
    </div>
  </div>

  <router-outlet></router-outlet>
</main>

<!-- Bottom navigation — mobile only -->
<nav class="bottom-nav" *ngIf="authService.isLoggedIn() && !isAdminPage">
  <a
    *ngFor="let link of navLinks"
    class="bottom-nav-item"
    [routerLink]="link.route"
    routerLinkActive="active"
    #rla="routerLinkActive"
  >
    <span class="nav-pill" [class.nav-pill--active]="rla.isActive">
      <mat-icon>{{ link.icon }}</mat-icon>
      <span class="nav-label">{{ link.label | t }}</span>
    </span>
  </a>
</nav>
