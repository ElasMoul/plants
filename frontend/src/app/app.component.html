<mat-toolbar color="primary" class="navbar" *ngIf="authService.isLoggedIn()">
  <a class="brand" routerLink="/plants">
    <mat-icon>local_florist</mat-icon>
    <span>PlantPal</span>
  </a>

  <nav class="nav-links" *ngIf="authService.isLoggedIn()">
    <a
      *ngFor="let link of navLinks"
      mat-button
      [routerLink]="link.route"
      routerLinkActive="active-link"
    >
      <mat-icon>{{ link.icon }}</mat-icon>
      <span class="nav-label">{{ link.label }}</span>
    </a>
  </nav>

  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-email" mat-menu-item disabled>
      {{ authService.getCurrentUser()?.email }}
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="app-content" [class.with-toolbar]="authService.isLoggedIn()">
  <router-outlet></router-outlet>
</main>
