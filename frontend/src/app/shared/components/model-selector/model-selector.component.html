<div class="model-selector-wrap">
  <mat-select
    class="model-select"
    panelClass="model-select-panel"
    [value]="selectedVision"
    [disabled]="saving"
    aria-label="Vision model preference"
    matTooltip="Vision model — identification + annotation"
    matTooltipPosition="below"
    (selectionChange)="onVisionChange($event)"
  >
    <mat-select-trigger>
      <mat-icon class="trigger-icon">{{ selectedVisionOption?.icon }}</mat-icon>
      <span class="trigger-label">{{ selectedVisionOption?.label }}</span>
    </mat-select-trigger>
    <mat-option
      *ngFor="let opt of visionOptions"
      [value]="opt.value"
      [matTooltip]="opt.tooltip"
      matTooltipPosition="right"
      [matTooltipShowDelay]="300"
    >
      <mat-icon>{{ opt.icon }}</mat-icon>
      {{ opt.label }}
    </mat-option>
  </mat-select>

  <mat-select
    class="model-select"
    panelClass="model-select-panel"
    [value]="selectedReasoning"
    [disabled]="saving"
    aria-label="Reasoning model preference"
    matTooltip="Reasoning model — care plans, cure advice, descriptions"
    matTooltipPosition="below"
    (selectionChange)="onReasoningChange($event)"
  >
    <mat-select-trigger>
      <mat-icon class="trigger-icon">{{ selectedReasoningOption?.icon }}</mat-icon>
      <span class="trigger-label">{{ selectedReasoningOption?.label }}</span>
    </mat-select-trigger>
    <mat-option
      *ngFor="let opt of reasoningOptions"
      [value]="opt.value"
      [matTooltip]="opt.tooltip"
      matTooltipPosition="right"
      [matTooltipShowDelay]="300"
    >
      <mat-icon>{{ opt.icon }}</mat-icon>
      {{ opt.label }}
    </mat-option>
  </mat-select>

  <mat-progress-spinner
    *ngIf="saving"
    diameter="20"
    mode="indeterminate"
    class="save-spinner"
  ></mat-progress-spinner>
</div>
