<button
  *ngIf="speechService.isSupported"
  mat-icon-button
  type="button"
  [attr.aria-label]="isReading ? ('Stop reading' | t) : ariaLabel"
  [matTooltip]="isReading ? ('Stop reading' | t) : ('Read aloud' | t)"
  [class.reading]="isReading"
  (click)="toggle()"
>
  <mat-icon>{{ isReading ? 'stop_circle' : 'volume_up' }}</mat-icon>
</button>
