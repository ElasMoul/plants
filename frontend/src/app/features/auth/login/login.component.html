<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-icon mat-card-avatar color="primary">local_florist</mat-icon>
      <mat-card-title>Sign in to PlantPal</mat-card-title>
      <mat-card-subtitle>Welcome back</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" data-testid="login-email" />
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width mt-16">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
            data-testid="login-password"
          />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">At least 8 characters</mat-error>
        </mat-form-field>

        <mat-checkbox formControlName="openAtlas" class="mt-16" data-testid="login-open-atlas">
          Continue into the Atlas — the botanical network view
        </mat-checkbox>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width mt-24"
          [disabled]="loading"
          data-testid="login-submit"
        >
          <mat-spinner *ngIf="loading" diameter="20" class="inline-spinner"></mat-spinner>
          <span *ngIf="!loading">Sign in</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <p class="register-link">
        Don't have an account?
        <a routerLink="/register" mat-button color="primary">Create one</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
