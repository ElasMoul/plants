<div class="page-container">

  <!-- loading: initial fetch -->
  <div class="state-screen" *ngIf="state === 'loading'">
    <mat-progress-spinner diameter="36" mode="indeterminate"></mat-progress-spinner>
  </div>

  <!-- pending: still being processed -->
  <div class="state-screen" *ngIf="state === 'pending'">
    <div class="scan-avatar">
      <img
        [src]="result?.photoUrl || placeholderImage"
        alt="Plant being scanned"
        class="scan-photo"
      />
      <div class="scan-sweep"></div>
      <div class="scan-ring"></div>
    </div>
    <h2 class="state-title">Analysing your plant&hellip;</h2>
    <p class="state-subtitle">Usually takes 10&ndash;20 seconds.</p>
    <mat-progress-bar mode="indeterminate" color="primary" class="state-progress"></mat-progress-bar>
  </div>

  <!-- failed -->
  <div class="state-screen" *ngIf="state === 'failed'">
    <mat-icon class="state-icon error-icon">hide_image</mat-icon>
    <h2 class="state-title">We couldn't identify this plant</h2>
    <p class="state-subtitle" *ngIf="result?.failureReason; else defaultSubtitle">{{ result!.failureReason }}</p>
    <ng-template #defaultSubtitle>
      <p class="state-subtitle">Something went wrong during analysis — please try uploading again.</p>
    </ng-template>
    <div class="failed-actions">
      <button
        mat-flat-button
        color="primary"
        type="button"
        class="btn-pill"
        [disabled]="isRetrying"
        (click)="onRetry()"
      >
        <mat-progress-spinner *ngIf="isRetrying" diameter="18" mode="indeterminate" class="retry-spinner"></mat-progress-spinner>
        <mat-icon *ngIf="!isRetrying">refresh</mat-icon>
        {{ isRetrying ? 'Retrying…' : 'Retry' }}
      </button>
      <button mat-stroked-button type="button" class="btn-pill" routerLink="/identify">
        <mat-icon>add_photo_alternate</mat-icon>
        Back to upload
      </button>
    </div>
  </div>

  <!-- blocked: AI ceiling reached (gateway 402) — explicit state, no retry spinner -->
  <div class="state-screen" *ngIf="state === 'blocked'">
    <app-ai-block-notice class="block-state-card" [reason]="result?.failureReason"></app-ai-block-notice>
    <button mat-stroked-button type="button" class="btn-pill" routerLink="/identify">
      <mat-icon>add_photo_alternate</mat-icon>
      Back to upload
    </button>
  </div>

  <!-- not found -->
  <div class="state-screen" *ngIf="state === 'not-found'">
    <mat-icon class="state-icon error-icon">search_off</mat-icon>
    <h2 class="state-title">Identification not found</h2>
    <button mat-stroked-button type="button" class="btn-pill" routerLink="/identify">
      <mat-icon>arrow_back</mat-icon>
      Back to list
    </button>
  </div>

  <!-- species-confirm: Flow 1 only — confirm/create the matched species -->
  <app-species-confirm-step
    *ngIf="state === 'species-confirm' && result"
    [identificationId]="result.id"
    (resolved)="onSpeciesResolved($event)"
  ></app-species-confirm-step>

  <!-- plant-select: Flow 1 only — attach to an existing plant or create a new one -->
  <app-plant-select-step
    *ngIf="state === 'plant-select' && result"
    [identificationId]="result.id"
    (resolved)="onPlantResolved($event)"
  ></app-plant-select-step>

  <!-- ready -->
  <div *ngIf="state === 'ready' && result">
    <div *ngIf="result.annotationStatus === 'FAILED'" class="stage-notice">
      <span class="stage-chip">
        <mat-icon>layers_clear</mat-icon>
        Overlay unavailable
      </span>
      <button mat-button class="retry-overlay-btn" (click)="onRetry()">
        <mat-icon>refresh</mat-icon>
        Retry overlay
      </button>
    </div>
    <app-identification-preview-section
      [result]="result"
      (saved)="onSaved($event)"
      (editBeforeSave)="onEditBeforeSave($event)"
      (discard)="onDiscard()"
    ></app-identification-preview-section>
  </div>

</div>
