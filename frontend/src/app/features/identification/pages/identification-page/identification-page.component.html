<div class="page-container">

  <h1 class="page-title">Identify Your Plant</h1>
  <p class="page-subtitle">Upload up to 5 photos and let AI identify your plant species</p>

  <!-- idle: upload form -->
  <ng-container *ngIf="state === 'idle'">
    <app-photo-upload (analyze)="onAnalyze($event)"></app-photo-upload>
  </ng-container>

  <!-- analyzing: spinner -->
  <ng-container *ngIf="state === 'analyzing'">
    <div class="loading-state">
      <mat-spinner diameter="64"></mat-spinner>
      <p class="loading-msg">Identifying your plant&hellip; this may take a few seconds</p>
    </div>
  </ng-container>

  <!-- preview: one-click save card + annotation panel -->
  <ng-container *ngIf="state === 'preview' && result">
    <app-preview-card
      [result]="result"
      [selectedRegionIndex]="selectedRegionIndex"
      (saved)="onSaved($event)"
      (edit)="onEditBeforeSave($event)"
      (discard)="onDiscard()"
    ></app-preview-card>

    <app-annotation-list
      *ngIf="result.annotationRegions && result.annotationRegions.length"
      [regions]="result.annotationRegions"
      [species]="result.scientificName"
      [identificationId]="result.id"
      (regionSelected)="onRegionSelected($event)"
    ></app-annotation-list>

    <app-disease-detail-panel
      [region]="selectedRegion"
      [species]="result.scientificName"
      [identificationId]="result.id"
    ></app-disease-detail-panel>
  </ng-container>

  <!-- error -->
  <ng-container *ngIf="state === 'error'">
    <mat-card class="error-card">
      <mat-card-content>
        <div class="error-content">
          <mat-icon color="warn" class="error-icon">error_outline</mat-icon>
          <p class="error-msg">{{ errorMessage }}</p>
        </div>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" type="button" (click)="retry()">
          <mat-icon>refresh</mat-icon>
          Retry
        </button>
        <button mat-stroked-button type="button" (click)="reset()">
          <mat-icon>add_photo_alternate</mat-icon>
          Change photo
        </button>
      </mat-card-actions>
    </mat-card>
  </ng-container>

</div>
