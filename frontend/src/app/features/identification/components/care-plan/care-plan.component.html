<!-- Skeleton while loading -->
<div *ngIf="!carePlan" class="skeleton-grid">
  <div *ngFor="let s of skeletonCards" class="skeleton-card">
    <div class="skeleton-icon"></div>
    <div class="skeleton-lines">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line long"></div>
    </div>
  </div>
</div>

<ng-container *ngIf="carePlan">

  <!-- Summary bar -->
  <div class="summary-bar">
    <span class="summary-item">
      <mat-icon>water_drop</mat-icon>
      Water every {{ carePlan.wateringFrequencyDays }} days
    </span>
    <ng-container *ngIf="carePlan.fertilizingFrequencyDays > 0">
      <span class="summary-sep">·</span>
      <span class="summary-item">
        <mat-icon>grass</mat-icon>
        Fertilize every {{ carePlan.fertilizingFrequencyDays }} days
      </span>
    </ng-container>
    <span class="summary-sep">·</span>
    <span class="summary-item">
      <mat-icon>eco</mat-icon>
      Repot every {{ carePlan.repottingFrequencyMonths }} months
    </span>
  </div>

  <!-- Card grid -->
  <div class="card-grid">
    <app-care-card
      *ngFor="let card of visibleCards"
      [card]="card"
    ></app-care-card>
  </div>

  <!-- Beginner warnings -->
  <div class="warnings-section" *ngIf="carePlan.beginnerWarnings.length">
    <p class="warnings-label">Watch out for</p>
    <div class="warnings-list">
      <div *ngFor="let warning of carePlan.beginnerWarnings" class="warning-chip">
        <mat-icon>warning_amber</mat-icon>
        <span>{{ warning }}</span>
      </div>
    </div>
  </div>

</ng-container>
