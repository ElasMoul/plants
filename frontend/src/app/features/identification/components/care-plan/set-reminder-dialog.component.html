<h2 mat-dialog-title>{{ 'Set a reminder' | t }}</h2>

<mat-dialog-content>
  <p class="dialog-text">{{ 'We\'ll remind you to {0} every:' | t : [(data.cardTitle | lowercase)] }}</p>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'Frequency' | t }}</mat-label>
      <input matInput type="number" formControlName="frequencyDays" min="1" />
      <span matSuffix>{{ ' days' | t }}</span>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'Cancel' | t }}</button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    class="btn-pill"
    [disabled]="form.invalid"
    (click)="confirm()"
  >
    {{ 'Set reminder' | t }}
  </button>
</mat-dialog-actions>
