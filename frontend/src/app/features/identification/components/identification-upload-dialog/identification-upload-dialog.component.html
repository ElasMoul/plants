<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <app-photo-upload [lockedPlantId]="data?.plantId" (analyze)="onAnalyze($event)"></app-photo-upload>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    class="btn-pill"
    [disabled]="!photoUpload?.entries?.length"
    (click)="startIdentification()"
  >
    <mat-icon>biotech</mat-icon>
    Start identification
  </button>
</mat-dialog-actions>
