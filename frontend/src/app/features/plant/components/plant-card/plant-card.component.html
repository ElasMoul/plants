<div class="plant-card" [routerLink]="['/plants', plant.id]" data-testid="plant-card">

  <!-- Photo with health badge overlay -->
  <div class="plant-photo">
    <img
      [src]="plant.photoUrl || placeholderImage"
      [alt]="plant.nickname"
      class="photo-img"
      (click)="openLightbox($event)"
    />

    <!-- Health badge -->
    <span
      *ngIf="plant.healthStatus"
      class="health-badge"
      [ngClass]="healthBadgeClass(plant.healthStatus)"
    >
      {{ (plant.healthStatus === 'ISSUES_DETECTED' ? 'ISSUES' : plant.healthStatus) | t }}
    </span>

    <!-- Actions menu -->
    <button
      mat-icon-button
      class="card-menu-btn"
      [matMenuTriggerFor]="actionMenu"
      (click)="$event.stopPropagation()"
      [attr.aria-label]="&#x27;Plant actions&#x27; | t"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #actionMenu="matMenu">
      <button mat-menu-item [routerLink]="['/plants', plant.id, 'edit']" (click)="$event.stopPropagation()">
        <mat-icon>edit</mat-icon>
        <span>{{ 'Edit' | t }}</span>
      </button>
      <button mat-menu-item class="archive-action" (click)="$event.stopPropagation(); archive.emit(plant.id)">
        <mat-icon>archive</mat-icon>
        <span>{{ 'Archive' | t }}</span>
      </button>
    </mat-menu>
  </div>

  <!-- Card body -->
  <div class="card-body">
    <h3 class="plant-name">{{ plant.nickname }}</h3>
    <p class="plant-species">{{ plant.commonName || plant.species || ('Species unknown' | t) }}</p>

    <!-- Next water chip -->
    <div class="next-water" *ngIf="plant.nextWaterDays !== null && plant.nextWaterDays !== undefined">
      <mat-icon class="water-icon">water_drop</mat-icon>
      <span>{{ 'Next water: {0} day{1}' | t : [(plant.nextWaterDays), (plant.nextWaterDays | pluralSuffix)] }}</span>
    </div>
  </div>

</div>
