<div class="plant-card" [routerLink]="['/plants', plant.id]">

  <!-- Photo with health badge overlay -->
  <div class="plant-photo">
    <img
      *ngIf="plant.photoUrl; else photoPlaceholder"
      [src]="plant.photoUrl"
      [alt]="plant.nickname"
      class="photo-img"
    />
    <ng-template #photoPlaceholder>
      <div class="photo-placeholder">
        <mat-icon>local_florist</mat-icon>
      </div>
    </ng-template>

    <!-- Health badge -->
    <span
      *ngIf="plant.healthStatus"
      class="health-badge"
      [ngClass]="{
        'badge-healthy':        plant.healthStatus === 'HEALTHY',
        'badge-issues':         plant.healthStatus === 'ISSUES_DETECTED',
        'badge-unknown':        plant.healthStatus === 'UNKNOWN'
      }"
    >
      {{ plant.healthStatus === 'ISSUES_DETECTED' ? 'ISSUES' : plant.healthStatus }}
    </span>

    <!-- Actions menu -->
    <button
      mat-icon-button
      class="card-menu-btn"
      [matMenuTriggerFor]="actionMenu"
      (click)="$event.stopPropagation()"
      aria-label="Plant actions"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #actionMenu="matMenu">
      <button mat-menu-item [routerLink]="['/plants', plant.id, 'edit']" (click)="$event.stopPropagation()">
        <mat-icon>edit</mat-icon>
        <span>Edit</span>
      </button>
      <button mat-menu-item class="archive-action" (click)="$event.stopPropagation(); archive.emit(plant.id)">
        <mat-icon>archive</mat-icon>
        <span>Archive</span>
      </button>
    </mat-menu>
  </div>

  <!-- Card body -->
  <div class="card-body">
    <h3 class="plant-name">{{ plant.nickname }}</h3>
    <p class="plant-species">{{ plant.commonName || plant.species || 'Species unknown' }}</p>

    <!-- Next water chip -->
    <div class="next-water" *ngIf="plant.nextWaterDays !== null && plant.nextWaterDays !== undefined">
      <mat-icon class="water-icon">water_drop</mat-icon>
      <span>Next water: {{ plant.nextWaterDays }} day{{ plant.nextWaterDays !== 1 ? 's' : '' }}</span>
    </div>
  </div>

</div>
