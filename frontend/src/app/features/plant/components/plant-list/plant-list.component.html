<div class="list-container">

  <!-- Header -->
  <div class="list-header">
    <div>
      <h1 class="garden-title">{{ 'My Garden' | t }}</h1>
      <p class="garden-subtitle" *ngIf="!loading">
        {{ 'You have {0} plant{1} under your care.' | t : [(plants.length), (plants.length | pluralSuffix)] }}
      </p>
    </div>
  </div>

  <!-- Loading skeleton -->
  <div *ngIf="loading" class="plant-grid">
    <div *ngFor="let _ of skeletons" class="skeleton-card">
      <div class="skeleton skeleton-photo"></div>
      <div class="skeleton-body">
        <div class="skeleton skeleton-line wide"></div>
        <div class="skeleton skeleton-line narrow"></div>
        <div class="skeleton skeleton-line medium"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && plants.length === 0" class="empty-state">
    <div class="empty-icon-wrap">
      <mat-icon class="empty-icon">local_florist</mat-icon>
    </div>
    <h2 class="empty-title">{{ 'Your garden awaits' | t }}</h2>
    <p class="empty-sub">{{ 'Add your first plant to start tracking its care.' | t }}</p>
    <button mat-raised-button color="primary" (click)="openIdentifyDialog()" class="empty-btn">
      <mat-icon>add</mat-icon>
      {{ 'Add your first plant' | t }}
    </button>
  </div>

  <!-- Plant grid -->
  <div *ngIf="!loading && plants.length > 0" class="plant-grid">
    <app-plant-card
      *ngFor="let plant of plants; trackBy: trackByPlantId"
      [plant]="plant"
      (archive)="onArchive($event)"
    ></app-plant-card>
  </div>

  <!-- Pagination -->
  <mat-paginator
    *ngIf="page && page.totalElements > pageSize"
    [length]="page.totalElements"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    [pageIndex]="currentPage"
    (page)="onPageChange($event)"
    showFirstLastButtons
  ></mat-paginator>

</div>

<!-- FAB: add plant -->
<button
  *ngIf="!loading"
  mat-fab
  color="primary"
  class="add-fab"
  (click)="openIdentifyDialog()"
  [attr.aria-label]="&#x27;Add plant&#x27; | t"
  data-testid="add-plant-btn"
>
  <mat-icon>add</mat-icon>
</button>
