# Local SonarQube Community Edition analysis for the Angular frontend.
# Run via scripts/sonar-scan.ps1 (needs SONAR_TOKEN in the environment).
sonar.host.url=http://localhost:9000
sonar.projectKey=plantpal-frontend
sonar.projectName=PlantPal Frontend

sonar.sources=src,projects
sonar.tests=src,projects
# src/test-setup.ts is jest setup (a jsdom polyfill used only by tests): test code, not application code.
sonar.test.inclusions=**/*.spec.ts,src/test-setup.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/test-setup.ts,src/environments/**,projects/atlas/src/app/world/world.bodies.ts,projects/atlas/src/app/chrome/overview.html.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.server.ts,src/app/app.server.module.ts,src/app/app.routes.server.ts
