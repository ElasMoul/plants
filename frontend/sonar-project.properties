# Local SonarQube Community Edition analysis for the Angular frontend.
# Run via scripts/sonar-scan.ps1 (needs SONAR_TOKEN in the environment).
sonar.host.url=http://localhost:9000
sonar.projectKey=plantpal-frontend
sonar.projectName=PlantPal Frontend

sonar.sources=src,projects
sonar.tests=src,projects
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/environments/**,projects/atlas/src/app/world/world.bodies.ts,projects/atlas/src/app/chrome/overview.html.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mirrors the '!' entries of collectCoverageFrom in jest.config.js (checked by scripts/check-sonar-coverage-exclusions.mjs).
sonar.coverage.exclusions=src/app/**/*.module.ts,src/app/**/*.model.ts,src/app/**/*.routing.ts,src/app/**/*-routing.module.ts,src/main.ts,src/app/app.component.ts,src/environments/**,projects/atlas/src/app/**/*.spec.ts,projects/atlas/src/app/world/world.bodies.ts,projects/atlas/src/app/chrome/overview.html.ts,projects/shared-core/src/lib/**/*.spec.ts
