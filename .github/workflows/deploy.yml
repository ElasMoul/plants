name: Deploy

on:
  push:
    branches: [main]

# Belt-and-suspenders guard — only runs on main
# (the `on.push.branches` filter above is the primary control;
# this env check makes the intent explicit in the job log)
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build artifacts first — tests already passed in CI so we skip them here
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build backend JAR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # io.platform:contracts is distributed by GitHub tag pinning (D031), not a
      # registry — build it from source at the version backend/pom.xml pins.
      - name: Read pinned contracts version
        id: contracts
        run: |
          VERSION=$(grep -A1 '<artifactId>contracts</artifactId>' backend/pom.xml | grep -oP '(?<=<version>)[^<]+')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout contracts at pinned tag
        uses: actions/checkout@v4
        with:
          repository: elmoul/contracts
          ref: v${{ steps.contracts.outputs.version }}
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          path: contracts-src

      - name: Install contracts bindings into local Maven repo
        working-directory: contracts-src/gen/java
        run: mvn install -DskipTests --batch-mode --no-transfer-progress

      - name: Package (skip tests — already verified in CI)
        working-directory: backend
        run: mvn package -DskipTests --batch-mode --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/plantpal-backend-*.jar
          retention-days: 1

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/plantpal/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy — only after both build jobs succeed
  # Requires: set RAILWAY_TOKEN in GitHub repository secrets before use
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Railway
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend/target/

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        # Requires: RAILWAY_TOKEN set in GitHub repository secrets
        working-directory: backend
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Requires: set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub secrets
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/plantpal/

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        # Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID set in GitHub secrets
        run: |
          vercel deploy frontend/dist/plantpal/ \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
