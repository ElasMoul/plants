name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Belt-and-suspenders guard — only runs on main
# (the `on.push.branches` filter above is the primary control;
# this env check makes the intent explicit in the job log)
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build artifacts first — tests already passed in CI so we skip them here
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build backend JAR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # io.platform:contracts is distributed by GitHub tag pinning (D031), not a
      # registry — build it from source at the version backend/pom.xml pins.
      - name: Read pinned contracts version
        id: contracts
        run: |
          VERSION=$(grep -A1 '<artifactId>contracts</artifactId>' backend/pom.xml | grep -oP '(?<=<version>)[^<]+')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout contracts at pinned tag
        uses: actions/checkout@v4
        with:
          repository: elmoul/contracts
          ref: v${{ steps.contracts.outputs.version }}
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          path: contracts-src

      - name: Install contracts bindings into local Maven repo
        working-directory: contracts-src/gen/java
        run: mvn install -DskipTests --batch-mode --no-transfer-progress

      - name: Package (skip tests — already verified in CI)
        working-directory: backend
        run: mvn package -DskipTests --batch-mode --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/plantpal-backend-*.jar
          retention-days: 1

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # environment.prod.ts ships with empty vapidPublicKey/sentryDsn placeholders —
      # fill them from repository secrets before the production build bakes them in.
      # Empty/unset secrets leave the placeholders empty (features degrade gracefully).
      # CLASSIC_PUBLIC_URL (repo variable) rewrites the atlas's localhost link back to
      # the classic app when the atlas is deployed too; unset leaves it local-only.
      - name: Inject production runtime config
        working-directory: frontend
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CLASSIC_PUBLIC_URL: ${{ vars.CLASSIC_PUBLIC_URL }}
        run: |
          sed -i "s|vapidPublicKey: ''|vapidPublicKey: '${VAPID_PUBLIC_KEY}'|" src/environments/environment.prod.ts
          sed -i "s|sentryDsn: ''|sentryDsn: '${SENTRY_DSN}'|" src/environments/environment.prod.ts
          # The atlas carries its own push subscribe (round 3) and its own copy of the
          # key — without this line a deployed atlas can never subscribe, whatever the
          # backend holds. Unset secret leaves the empty placeholder (push refused in words).
          sed -i "s|vapidPublicKey: ''|vapidPublicKey: '${VAPID_PUBLIC_KEY}'|" projects/atlas/src/environments/environment.prod.ts
          # This build is the Vercel upload, the only host serving /_vercel/* (Analytics + Speed Insights).
          sed -i "s|vercelAnalytics: false|vercelAnalytics: true|" src/environments/environment.prod.ts
          if [ -n "$CLASSIC_PUBLIC_URL" ]; then
            sed -i "s|classicAppUrl: 'https://localhost:8444'|classicAppUrl: '${CLASSIC_PUBLIC_URL}'|" projects/atlas/src/environments/environment.prod.ts
          fi

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Build atlas (production)
        working-directory: frontend
        run: npm run build:atlas:prod

      - name: Upload atlas dist
        uses: actions/upload-artifact@v7
        with:
          name: atlas-dist
          path: frontend/dist/atlas/browser/

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/plantpal/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy — only after both build jobs succeed.
  # Backend runs on the OVH VPS (docker compose under /opt/plantpal, see
  # deploy/vps/ and DEPLOYMENT.md). Requires secrets VPS_HOST, VPS_SSH_KEY
  # (private key of the `deploy` user) and VPS_KNOWN_HOSTS (ssh-keyscan output).
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: jar/

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::VPS_HOST secret is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # Stack files are versioned in the repo and refreshed on every deploy; .env
      # lives only on the server. The previous JAR is kept as app.jar.prev for rollback.
      - name: Upload stack files + JAR
        env:
          TARGET: deploy@${{ secrets.VPS_HOST }}
        run: |
          JAR=$(ls jar/plantpal-backend-*.jar | head -n1)
          scp deploy/vps/docker-compose.yml deploy/vps/Caddyfile "$TARGET:/opt/plantpal/"
          scp deploy/vps/backend/Dockerfile "$TARGET:/opt/plantpal/backend/Dockerfile"
          scp "$JAR" "$TARGET:/opt/plantpal/backend/app.jar.new"

      - name: Restart stack and wait for healthy backend
        env:
          TARGET: deploy@${{ secrets.VPS_HOST }}
        run: |
          ssh "$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/plantpal
          [ -f backend/app.jar ] && cp backend/app.jar backend/app.jar.prev
          mv backend/app.jar.new backend/app.jar
          docker compose up -d --build --remove-orphans
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' plantpal-backend-1)
            echo "backend: $status"
            [ "$status" = healthy ] && { docker image prune -f >/dev/null; exit 0; }
            sleep 6
          done
          docker compose logs --tail 150 backend
          exit 1
          REMOTE

  # ─────────────────────────────────────────────────────────────────────────────
  # Requires: set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub secrets
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/plantpal/

      - name: Install Vercel CLI
        run: npm install -g vercel

      # The Angular app calls the API with a RELATIVE apiUrl (/api/v1) — on Vercel that
      # only works if /api/* is rewritten to the VPS backend. BACKEND_PUBLIC_URL is a
      # repository *variable* (Settings → Variables), e.g. https://api.plants.moulworks.com —
      # no trailing slash. The second rewrite is the SPA fallback for client-side routes.
      - name: Write vercel.json (API proxy + SPA fallback)
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          test -n "$BACKEND_PUBLIC_URL" || { echo "::error::BACKEND_PUBLIC_URL repository variable is not set"; exit 1; }
          cat > frontend/dist/plantpal/vercel.json <<EOF
          {
            "version": 2,
            "builds": [{ "src": "**/*", "use": "@vercel/static" }],
            "routes": [
              { "src": "/api/(.*)", "dest": "${BACKEND_PUBLIC_URL}/api/\$1" },
              { "src": "/photos/(.*)", "dest": "${BACKEND_PUBLIC_URL}/photos/\$1" },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          cat frontend/dist/plantpal/vercel.json

      - name: Deploy to Vercel
        # Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID set in GitHub secrets
        run: |
          vercel deploy frontend/dist/plantpal/ \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ───────────────────────────────────────────────────────────────────────────
  # Atlas frontend — a SECOND Vercel project (optional: set repo variable
  # DEPLOY_ATLAS=true + secret VERCEL_PROJECT_ID_ATLAS to enable). Same backend,
  # same rewrites; the login handoff carries the session across the two domains.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-atlas:
    name: Deploy atlas (Vercel)
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ATLAS == 'true'

    steps:
      - name: Download atlas dist
        # v8 to match the backend/frontend deploy jobs — the only download path
        # proven against this workflow's upload-artifact@v7 producers.
        uses: actions/download-artifact@v8
        with:
          name: atlas-dist
          path: atlas-dist/

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Write vercel.json (API + photos proxy, SPA fallback)
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          test -n "$BACKEND_PUBLIC_URL" || { echo "::error::BACKEND_PUBLIC_URL repository variable is not set"; exit 1; }
          cat > atlas-dist/vercel.json <<EOF
          {
            "version": 2,
            "builds": [{ "src": "**/*", "use": "@vercel/static" }],
            "routes": [
              { "src": "/api/(.*)", "dest": "${BACKEND_PUBLIC_URL}/api/\$1" },
              { "src": "/photos/(.*)", "dest": "${BACKEND_PUBLIC_URL}/photos/\$1" },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          cat atlas-dist/vercel.json

      - name: Deploy atlas to Vercel
        run: |
          vercel deploy atlas-dist/ \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ATLAS }}
