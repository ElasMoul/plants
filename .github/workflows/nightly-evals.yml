name: Nightly AI Evals

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC — outside peak GitHub Models quota windows
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  ai-evals:
    name: AI Model Eval Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30   # DeepSeek-R1 can take ~60s per call; 3 tests × 60s + margin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run AI eval suite
        working-directory: backend
        env:
          RUN_AI_EVALS: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minimal secrets so Spring Boot starts without errors even though no DB is used
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'eval-jwt-secret-padded-to-at-least-64-chars-for-testing-0000' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'eval-vapid-public-key' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || 'eval-vapid-private-key' }}
        # Run only the eval IT class; -Dskip.integration.tests=false to let failsafe include it.
        # The test skips itself via @EnabledIfEnvironmentVariable unless RUN_AI_EVALS=true.
        run: |
          mvn test \
            -Dtest=IdentificationEvalIT \
            --no-transfer-progress \
            -Dspring.profiles.active=dev

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: backend/target/surefire-reports/
          retention-days: 30
