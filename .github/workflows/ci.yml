name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from the Actions tab / API

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — Java 21, Maven, Testcontainers (Docker available on ubuntu-latest)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # io.platform:contracts is distributed by GitHub tag pinning (D031), not a
      # registry — build it from source at the version backend/pom.xml pins.
      - name: Read pinned contracts version
        id: contracts
        run: |
          VERSION=$(grep -A1 '<artifactId>contracts</artifactId>' backend/pom.xml | grep -oP '(?<=<version>)[^<]+')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout contracts at pinned tag
        uses: actions/checkout@v7
        with:
          repository: elmoul/contracts
          ref: v${{ steps.contracts.outputs.version }}
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          path: contracts-src

      - name: Install contracts bindings into local Maven repo
        working-directory: contracts-src/gen/java
        run: mvn install -DskipTests --batch-mode --no-transfer-progress

      - name: Build and test
        working-directory: backend
        run: mvn clean verify --batch-mode --no-transfer-progress -Ddependency.check.skip=true

      #- name: Trivy vulnerability scan
      #  uses: aquasecurity/trivy-action@master
      #  with:
      #    scan-type: fs
      #    scan-ref: backend
      #    severity: CRITICAL,HIGH
      #    exit-code: '1'
      #    format: table

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend — Node 18, Angular build + lint
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 18
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # E2E (Playwright) — disabled until tests are stabilised
      # - name: Install Playwright browsers
      #   working-directory: frontend
      #   run: npx playwright install --with-deps chromium webkit
      # - name: E2E tests
      #   working-directory: frontend
      #   run: npm run e2e
      #   env:
      #     CI: true
      # - name: Upload E2E screenshots
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-screenshots
      #     path: |
      #       frontend/playwright-report/
      #       frontend/test-results/**/*.png
      #     if-no-files-found: ignore
      #     retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # AI Visual Review — advisory only, never gates CI
  # Posts a PR comment with AI observations on E2E screenshots.
  # NOT a required status check — runs with continue-on-error throughout.
  # ─────────────────────────────────────────────────────────────────────────────
  ai-visual-review:
    name: AI Visual Review (advisory)
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Download E2E artifacts
        uses: actions/download-artifact@v8
        with:
          name: playwright-screenshots
          path: frontend/e2e/screenshots
        continue-on-error: true  # No screenshots = no review, not a failure
      - name: Run AI visual review
        run: node scripts/ai-visual-review.mjs --screenshots-dir frontend/e2e/screenshots --pr ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        continue-on-error: true  # Advisory — never gates CI

  # Lighthouse CI — disabled until E2E / serve setup is stabilised
