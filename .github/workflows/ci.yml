name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — Java 21, Maven, Testcontainers (Docker available on ubuntu-latest)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend — Node 18, Angular build + lint
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # E2E (Playwright) — disabled until tests are stabilised
      # - name: Install Playwright browsers
      #   working-directory: frontend
      #   run: npx playwright install --with-deps chromium webkit
      # - name: E2E tests
      #   working-directory: frontend
      #   run: npm run e2e
      #   env:
      #     CI: true
      # - name: Upload E2E screenshots
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-screenshots
      #     path: |
      #       frontend/playwright-report/
      #       frontend/test-results/**/*.png
      #     if-no-files-found: ignore
      #     retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # AI Visual Review — advisory only, never gates CI
  # Posts a PR comment with AI observations on E2E screenshots.
  # NOT a required status check — runs with continue-on-error throughout.
  # ─────────────────────────────────────────────────────────────────────────────
  ai-visual-review:
    name: AI Visual Review (advisory)
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download E2E artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/e2e/screenshots
        continue-on-error: true  # No screenshots = no review, not a failure
      - name: Run AI visual review
        run: node scripts/ai-visual-review.mjs --screenshots-dir frontend/e2e/screenshots --pr ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        continue-on-error: true  # Advisory — never gates CI

  # ─────────────────────────────────────────────────────────────────────────────
  # Lighthouse CI — performance, accessibility, best-practices, SEO budgets
  # ─────────────────────────────────────────────────────────────────────────────
  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Angular app
        working-directory: frontend
        run: npm run build
      - name: Run Angular app (background)
        working-directory: frontend
        run: npx http-server dist/frontend -p 4200 &
      - name: Wait for app to be ready
        run: npx wait-on http://localhost:4200 --timeout 60000
      - name: Lighthouse CI
        working-directory: frontend
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
