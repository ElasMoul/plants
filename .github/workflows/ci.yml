name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — Java 21, Maven, Testcontainers (Docker available on ubuntu-latest)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend — Node 18, Angular build + lint
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build:prod

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        working-directory: frontend
        run: npm run e2e -- --ignore=e2e/journeys/visual.spec.ts
        env:
          CI: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Lighthouse CI — performance, accessibility, best-practices, SEO budgets
  # ─────────────────────────────────────────────────────────────────────────────
  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Angular app
        working-directory: frontend
        run: npm run build
      - name: Run Angular app (background)
        working-directory: frontend
        run: npx http-server dist/frontend -p 4200 &
      - name: Wait for app to be ready
        run: npx wait-on http://localhost:4200 --timeout 60000
      - name: Lighthouse CI
        working-directory: frontend
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
