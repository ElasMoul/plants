name: Secret Scanning

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect secrets (new commits only)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            ./gitleaks detect --source . --redact -v --log-opts="${BASE}..${HEAD}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              ./gitleaks detect --source . --redact -v --log-opts="HEAD~1..HEAD"
            else
              ./gitleaks detect --source . --redact -v --log-opts="${BEFORE}..${{ github.sha }}"
            fi
          fi
