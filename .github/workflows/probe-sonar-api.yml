name: probe-sonar-api
on:
  pull_request:
    branches: [dev]
    paths: ['.github/workflows/probe-sonar-api.yml']
jobs:
  probe:
    runs-on: [self-hosted, platform]
    env:
      H: http://host.docker.internal:9000
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - run: |
          K=plantpal-backend
          c() { printf '%s -> ' "$1"; curl -s -m 20 -o /tmp/o -w '%{http_code}' -u "$SONAR_TOKEN:" "$H/api/$1"; echo " $(head -c 200 /tmp/o | tr '\n' ' ')"; }
          c "measures/component_tree?component=$K&metricKeys=new_uncovered_lines&qualifiers=FIL&ps=3"
          c "measures/component_tree?component=$K&metricKeys=uncovered_lines&qualifiers=FIL&ps=3"
          c "measures/component?component=$K&metricKeys=new_uncovered_lines,new_lines_to_cover"
          c "measures/search?projectKeys=$K&metricKeys=new_uncovered_lines"
          c "components/tree?component=$K&qualifiers=FIL&ps=3"
          c "issues/search?componentKeys=$K&ps=1"
          c "measures/component?component=$K:src/main/java/com/plantpal/shared/probe/SonarFailureProbe.java&metricKeys=new_uncovered_lines"
          c "users/current"
          c "authentication/validate"
