schema: app.descriptor/1
name: plantpal
display: Planotell
tracker:
  youtrack: PLA
  workflow:
    planned: Plan
    developing: Develop
    ready-for-test: Review
    accepted: Staging
code:
  layout: in-repo
  appRoot: '.'
  ownership: owned
  repo: https://github.com/ElasMoul/plants
  githubSlug: ElasMoul/plants
  integrationBranch: dev
  releaseBranch: main
delivery:
  mode: full
  requiredChecks: [Backend CI, Frontend CI, sonar-gate]
urls:
  hostname: planotell
  dev: http://127.0.0.1:8184
  production: https://www.planotell.com
commands:
  review:
    start: [tools/dev-delivery/.venv/Scripts/python.exe, tools/dev-delivery/dev_delivery.py, review, start]
    stop: [tools/dev-delivery/.venv/Scripts/python.exe, tools/dev-delivery/dev_delivery.py, review, stop]
    startTimeoutMs: 1800000
  deploy:
    dev: [tools/dev-delivery/.venv/Scripts/python.exe, tools/dev-delivery/dev_delivery.py, deploy]
