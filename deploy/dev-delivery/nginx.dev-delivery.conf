# Planotell dev-delivery frontend: plain http on :80 (the stack publishes it on
# 127.0.0.1:8184). The launcher/gateway name proxy terminates the hostname;
# this server answers any Host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Observed identity + health of THIS stack's backend (D113): proxied so a
    # check made through the public URL proves what that URL serves.
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    location = /actuator/info {
        proxy_pass http://backend:8080/actuator/info;
    }

    # Swagger UI + OpenAPI document (dev and review only): without these the paths fall
    # through to the Angular index. Host keeps the port so springdoc's redirect stays reachable.
    location = /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/chat/stream {
        proxy_pass http://backend:8080/api/v1/chat/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /photos/ {
        proxy_pass http://backend:8080/photos/;
        proxy_set_header Host $host;
    }
}
