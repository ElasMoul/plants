# PlantPal production stack on the OVH VPS (replaces Railway).
#
# Lives at /opt/plantpal on the server. CI (.github/workflows/deploy.yml) copies
# this file, Caddyfile, backend/Dockerfile and the freshly built JAR over SSH on
# every push to main, then runs `docker compose up -d --build`. The .env next to
# this file is created by hand once and never leaves the server (see .env.example).
#
# Only Caddy publishes ports (80/443). Postgres, Redis and the backend are reachable
# on the internal compose network only.

name: plantpal

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plantpal
      POSTGRES_USER: plantpal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantpal -d plantpal"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: ./backend
    image: plantpal-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Every app variable (JWT_SECRET, ANTHROPIC_API_KEY, CLOUDINARY_URL, ...) comes
    # from .env; the two connection URLs are derived here so the passwords live once.
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/plantpal?user=plantpal&password=${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=50}
    volumes:
      # Only used when STORAGE_TYPE=local; Cloudinary is the recommended prod store.
      - photos:/tmp/plantpal/photos
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot runs every Liquibase migration against an empty database.
      start_period: 180s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  photos:
  caddy-data:
  caddy-config:
