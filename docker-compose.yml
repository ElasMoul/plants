services:

  # ─────────────────────────────────────────
  # PostgreSQL 15
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: plantpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plantpal_dev
      POSTGRES_USER: plantpal
      POSTGRES_PASSWORD: plantpal
    ports:
      - "15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantpal -d plantpal_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plantpal-network

  # ─────────────────────────────────────────
  # Spring Boot Backend
  # Requires: backend/.env (copy from backend/.env.example and fill in secrets)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Requires a "contracts-m2" build context pointing at the host's local
      # .m2 contracts 0.17.0 artifact -- see backend/Dockerfile and
      # DEPLOYMENT.md. CONTRACTS_M2_0_17_0 must be set in the shell (path
      # syntax differs per OS, so it isn't hardcoded here); e.g.:
      #   export CONTRACTS_M2_0_17_0=$HOME/.m2/repository/io/platform/contracts/0.17.0   (bash)
      #   $env:CONTRACTS_M2_0_17_0 = "$HOME\.m2\repository\io\platform\contracts\0.17.0"  (PowerShell)
      additional_contexts:
        contracts-m2: ${CONTRACTS_M2_0_17_0}
    container_name: plantpal-backend
    restart: unless-stopped
    ports:
      - "8180:8080"
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Override DB + Redis + Kafka hosts to use Docker service names (not localhost).
      # These must ALSO override any PORT that backend/.env remaps: .env carries
      # host-published ports (e.g. REDIS_PORT=16379, platform port block) for native
      # host runs, but inside the compose network every service still listens on its
      # container port. env_file values reach the container too, so each remapped one
      # needs an explicit entry here (environment: beats env_file:) or the backend
      # dials the wrong port — e.g. redis:16379 -> Connection refused, health DOWN.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plantpal_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Ollama runs on the host machine — host.docker.internal resolves on Docker Desktop
      # OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - photos_data:/tmp/plantpal/photos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - plantpal-network

  # ─────────────────────────────────────────
  # Angular Frontend (Nginx, production build)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantpal-frontend
    restart: unless-stopped
    ports:
      - "8181:80"
      - "8444:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - plantpal-network

  # ─────────────────────────────────────────
  # Redis (cache + rate limiting via Bucket4j)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: plantpal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --save 300 10
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plantpal-network

  # ─────────────────────────────────────────
  # Zookeeper (Kafka coordination)
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: plantpal-zookeeper
    restart: unless-stopped
    ports:
      - "12181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - plantpal-network

  # ─────────────────────────────────────────
  # Kafka (async identification pipeline)
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: plantpal-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "29192:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT is the internal docker-network listener (kafka:9092, unchanged — container
      # port only, no host mapping). PLAINTEXT_HOST is the host-facing listener and must match
      # the new host port mapping above (29192) or host-side clients (native `mvn spring-boot:run`,
      # local kafka CLI tools) will connect but advertise/rediscover the broker on the old port.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - plantpal-network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  photos_data:
    driver: local

# ─────────────────────────────────────────
# Network
# ─────────────────────────────────────────
networks:
  plantpal-network:
    driver: bridge
